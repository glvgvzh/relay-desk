name: Продуктовая задача
description: Изменение пользовательского поведения Relay Desk
title: '[RD-]: '
labels: ['type: feature']
body:
  - type: textarea
    id: context
    attributes:
      label: Контекст
      description: Какую проблему пользователя или команды решаем?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Ожидаемый результат
      description: Что должно измениться для пользователя?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии приёмки
      placeholder: '- [ ] ...'
    validations:
      required: true
  - type: textarea
    id: unknowns
    attributes:
      label: Открытые вопросы
      description: Что нужно уточнить до или во время работы?
